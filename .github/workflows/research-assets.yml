name: Inspect venue photography
on:
  push:
    branches: [main]
    paths: ['scripts/research-assets.py', '.github/workflows/research-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow requests beautifulsoup4
      - run: python scripts/research-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: venue-research-not-for-production
          path: research-output/
          retention-days: 3
