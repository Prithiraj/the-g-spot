name: Build, verify and publish preview
on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/research-assets.py'
      - '.github/workflows/research-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g-spot-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,build_type,source,status}'
      - name: Install build and test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          mkdir -p .cache
          curl --fail --location --retry 3 https://unpkg.com/axe-core@4.10.3/axe.min.js -o .cache/axe.min.js
      - name: Build optimized static preview
        run: |
          python scripts/build.py
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/revision.json
      - name: Browser, accessibility and release-gate checks
        run: python scripts/test-site.py
      - name: Preserve QA and built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-and-verification
          path: |
            dist/
            qa/
            site/
            scripts/
            content/
            docs/
            requirements-dev.txt
          retention-days: 7
      - name: Include verification report
        run: |
          mkdir -p dist/verification
          cp qa/REPORT.md qa/results.json dist/verification/
      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified preview
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify the live site and deployed revision
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/verify-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-deployment-verification
          path: live-verification.json
          retention-days: 30
